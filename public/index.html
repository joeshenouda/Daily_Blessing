<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="A little time in the Word. Daily Bible readings and questions for grades 1–8 at St. Mary Coptic Orthodox Church.">
  <title>Daily Blessings · A little time in the Word</title>
